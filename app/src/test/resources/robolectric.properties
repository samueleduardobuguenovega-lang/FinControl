# Sandbox de Robolectric para los tests unitarios.
#
# La app apunta a API 36, pero el sandbox de API 36 de Robolectric necesita un
# runtime Java 21 para correr; el JDK que trae Android Studio es 21, pero un
# JDK 17 pelado (el que pide AGP 8 para compilar) no alcanza. Correr los tests
# en el sandbox de API 35 deja `./gradlew testDebugUnitTest` en verde en los dos
# casos, y lo que se prueba (fallback de sesión, esquema SQLite, arranque de
# activities) es igual en 35 y en 36.
sdk=35
