# Configuración de Gradle para todo el proyecto.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Obligatorio con Android Gradle Plugin 8.x cuando el proyecto usa librerías
# AndroidX (en AGP 9 ya viene por defecto, en 8 no). Sin esto el build se cae con
# "This project uses AndroidX dependencies, but the 'android.useAndroidX'
# property is not enabled".
android.useAndroidX=true

# Cada módulo tiene su propia clase R. Compila más rápido y mantiene el
# comportamiento que el proyecto ya tenía.
android.nonTransitiveRClass=true

# Con el Configuration Cache activo, Gradle se salta entera la fase de
# configuración si nada que afecte la config del build cambió.
org.gradle.configuration-cache=true
